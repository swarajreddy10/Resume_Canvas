[test]
preload = ["./tests/setup.ts"]
# text prints the table (and is what enforces the threshold); lcov writes coverage/lcov.info.
coverageReporter = ["text", "lcov"]
# Helpers and setup are not product code.
coveragePathIgnorePatterns = ["tests/**"]
# Bun applies these to every file the tests load, not to the total. Measured on the unit
# suite: lowest file 89.09% lines (memory-cache.ts), 75.00% functions (logger.ts); total
# 97.54% lines, 92.51% functions. Raise as coverage grows; never lower to pass.
coverageThreshold = { lines = 0.89, functions = 0.75 }
