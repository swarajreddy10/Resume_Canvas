[test]
preload = ["./tests/setup.ts"]
# text prints the table; lcov writes coverage/lcov.info for SonarQube Cloud.
coverageReporter = ["text", "lcov"]
# Helpers and setup are not product code.
coveragePathIgnorePatterns = ["tests/**"]
# No coverageThreshold: Bun applies it to every coverage run, the integration run
# included, and to the files a run loads rather than the project. Coverage is gated on
# new code in SonarQube Cloud instead (Sonar way: at least 80%), from both runs' LCOV.
# https://docs.sonarsource.com/sonarqube-cloud/standards/managing-quality-gates/introduction-to-quality-gates/
