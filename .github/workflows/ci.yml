name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Read-only token for every job.
# https://docs.github.com/en/actions/reference/security/secure-use
permissions:
  contents: read

# A newer push to the same ref cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs; the comment names the release.
# setup-bun reads the Bun version from package.json (packageManager).
jobs:
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun ci
      - run: bun run type-check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun ci
      - run: bun run lint:check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun ci
      # Writes coverage/lcov.info for the sonar job.
      - run: bun run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-unit
          path: coverage/lcov.info
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun ci
      # Route handlers against a real in-memory MongoDB (mongodb-memory-server); writes
      # coverage-integration/lcov.info for the sonar job.
      - run: bun run test:integration:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-integration
          path: coverage-integration/lcov.info
          if-no-files-found: error

  # SonarQube Cloud CI-based analysis with both coverage reports; its quality gate (Sonar
  # way) requires at least 80% coverage on new code. Automatic analysis cannot import
  # coverage and must be off, or this job fails.
  # https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/ci-based-analysis/github-actions-for-sonarcloud/
  sonar:
    needs: [unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for blame and new-code detection.
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-unit
          path: coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-integration
          path: coverage-integration
      # package.json's version is the project version, so a version bump starts a new
      # "new code" period under the project's Previous version definition.
      - id: version
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.projectVersion=${{ steps.version.outputs.value }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The build evaluates server modules that read these at import time
    # (src/lib/config/app.config.ts, src/lib/email/resend.service.ts). Placeholders only;
    # the deployed app gets real values from Vercel.
    env:
      MONGODB_URI: mongodb://127.0.0.1:1/build-placeholder
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: build-placeholder-secret-0123456789abcdef
      GOOGLE_CLIENT_ID: build-placeholder
      GOOGLE_CLIENT_SECRET: build-placeholder
      GROQ_API_KEY: build-placeholder
      RESEND_API_KEY: re_build_placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun ci
      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun ci
      # Both browser installers come from the lockfile-pinned packages through the
      # package script, never a registry lookup by bare name.
      - run: bun run test:e2e:browsers
      # The PDF route renders with Puppeteer's own Chrome, sandboxed under NODE_ENV
      # production. Ubuntu 23.10+ blocks the user namespaces that sandbox needs
      # (https://pptr.dev/troubleshooting); lift it on this throwaway runner
      # (https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md).
      - run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      # Builds the app and serves it against an in-memory MongoDB with placeholder
      # configuration (config/playwright.config.ts, scripts/e2e-server.ts).
      - run: bun run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
