# SonarQube Cloud CI-based analysis (the sonar job in .github/workflows/ci.yml).
# Automatic analysis cannot import coverage, so it is switched off for this project.
# https://docs.sonarsource.com/sonarqube-cloud/enriching/test-coverage/overview/
sonar.organization=swarajreddy10
sonar.projectKey=swarajreddy10_Resume_Canvas

# Main code is the whole repository (application, scripts, configuration, workflows,
# Dockerfile) except the tests, which are analysed as test code. A file cannot be in both.
# https://docs.sonarsource.com/sonarqube-cloud/managing-your-projects/project-analysis/setting-analysis-scope/setting-initial-scope/
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,coverage/**,coverage-integration/**,coverage-unloaded/**,playwright-report/**,test-results/**

# Unit and integration coverage (a line counts as covered when either run executed it),
# plus every source file neither run loaded, at zero (scripts/lcov-unloaded-files.ts).
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-integration/lcov.info,coverage-unloaded/lcov.info

# Sample résumés for the template gallery: five records of one shape, so copy-paste
# detection reports them as duplicated code. They are data, not logic.
sonar.cpd.exclusions=src/components/resume/templateLibrary.ts
